<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة السائق - منظومة حافلات النقل</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-elevated: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 16px;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-indicator.offline {
            background-color: rgba(148, 163, 184, 0.1);
            color: var(--text-muted);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .status-indicator.live {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .container {
            flex: 1;
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-input {
            width: 100%;
            background-color: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 13px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-success {
            background-color: var(--success);
            color: #fff;
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: #fff;
        }

        .telemetry-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .telemetry-box {
            background-color: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
        }

        .telemetry-val {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
        }

        .telemetry-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .action-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .driver-info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .driver-info-header h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .driver-info-header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .passengers-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 280px;
            overflow-y: auto;
        }

        .passenger-item {
            background-color: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .passenger-name {
            font-size: 14px;
            font-weight: 700;
        }

        .passenger-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .call-action {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background-color: var(--bg-elevated);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid var(--border);
        }

        .hidden {
            display: none !important;
        }

        .sweet-dialog-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .sweet-dialog-backdrop.active {
            display: flex;
        }

        .sweet-dialog-panel {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            width: 100%;
            max-width: 400px;
            padding: 30px 24px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            animation: dialogPop 0.2s ease-out;
        }

        @keyframes dialogPop {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .sweet-dialog-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            margin: 0 auto 16px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .sweet-dialog-icon.success {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .sweet-dialog-icon.error {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .sweet-dialog-icon.warning {
            background-color: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .sweet-dialog-icon.info {
            background-color: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(37, 99, 235, 0.3);
        }

        .sweet-dialog-title {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .sweet-dialog-message {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .sweet-dialog-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="brand-title">
            <i class="fas fa-bus-simple"></i>
            <span>بوابة السائق الميدانية</span>
        </div>
        <div class="status-indicator offline" id="statusPill">
            <span id="statusPillText">غير متصل</span>
        </div>
    </div>

    <main class="container">
        
        <div class="panel" id="authPanel">
            <div class="panel-title">
                <i class="fas fa-lock"></i>
                <span>تسجيل دخول السائق</span>
            </div>
            <form id="authForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="driverPhone">رقم الهاتف المعتمد</label>
                    <input type="tel" id="driverPhone" class="form-input" required placeholder="أدخل رقم الهاتف المسجل">
                </div>
                <div class="form-group">
                    <label for="driverPass">كلمة المرور</label>
                    <input type="password" id="driverPass" class="form-input" required placeholder="أدخل كلمة المرور">
                </div>
                <button type="submit" class="btn btn-primary" id="authBtn">
                    <i class="fas fa-arrow-right-to-bracket"></i>
                    <span>تسجيل الدخول</span>
                </button>
            </form>
        </div>

        <div class="panel hidden" id="dashboardPanel">
            <div class="driver-info-header">
                <div>
                    <h3 id="driverDisplayName">السائق</h3>
                    <p id="busRouteDisplay">بيانات الحافلة</p>
                </div>
                <button type="button" class="btn btn-danger" id="logoutBtn" style="width: auto; padding: 8px 12px; font-size: 12px;">
                    <i class="fas fa-arrow-right-from-bracket"></i>
                    <span>خروج</span>
                </button>
            </div>

            <div class="telemetry-row">
                <div class="telemetry-box">
                    <div class="telemetry-val" id="telemetrySpeed">0</div>
                    <div class="telemetry-label">السرعة (كم/س)</div>
                </div>
                <div class="telemetry-box">
                    <div class="telemetry-val" id="telemetryAccuracy">—</div>
                    <div class="telemetry-label">دقة الإشارة</div>
                </div>
            </div>

            <div id="tripIdleControls" class="action-stack">
                <button type="button" class="btn btn-primary" id="btnStartMorning">
                    <i class="fas fa-play"></i>
                    <span>بدء الرحلة الصباحية</span>
                </button>
                <button type="button" class="btn btn-primary" id="btnStartEvening" style="background-color: #475569;">
                    <i class="fas fa-play"></i>
                    <span>بدء الرحلة المسائية</span>
                </button>
            </div>

            <div id="tripRunningControls" class="action-stack hidden">
                <div style="background-color: var(--bg-base); padding: 12px; border-radius: 10px; border: 1px solid var(--border); text-align: center; margin-bottom: 6px;">
                    <span id="currentStatusText" style="font-size: 14px; font-weight: 700; color: #34d399;">الرحلة قيد التنفيذ والموقع قيد البث</span>
                </div>
                <button type="button" class="btn btn-success" id="btnArrived">
                    <i class="fas fa-check-double"></i>
                    <span>تم الوصول إلى الوجهة</span>
                </button>
                <button type="button" class="btn btn-danger" id="btnEndTrip">
                    <i class="fas fa-stop"></i>
                    <span>إنهاء الرحلة الحالية</span>
                </button>
            </div>
        </div>

        <div class="panel hidden" id="passengersPanel">
            <div class="panel-title">
                <i class="fas fa-users"></i>
                <span>قائمة الركاب والمشتركين (<span id="passengersCount">0</span>)</span>
            </div>
            <div class="passengers-list" id="passengersListContainer">
                <p style="text-align: center; color: var(--text-muted); padding: 12px; font-size: 13px;">جاري تحميل الأسماء...</p>
            </div>
        </div>

    </main>

    <div class="sweet-dialog-backdrop" id="sweetDialogBackdrop">
        <div class="sweet-dialog-panel">
            <div class="sweet-dialog-icon info" id="sweetDialogIcon">
                <i class="fas fa-info"></i>
            </div>
            <div class="sweet-dialog-title" id="sweetDialogTitle">تنبيه</div>
            <div class="sweet-dialog-message" id="sweetDialogMessage">الرسالة</div>
            <div class="sweet-dialog-buttons">
                <button type="button" class="btn btn-primary" id="sweetDialogBtn">موافق</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://oogbfwcbfhacsuxdjcne.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_0Yj2RwNpLbxFDFOS0-baVQ_JAjAaDLm';

        let sbClient = null;
        let broadcastChannel = null;
        let watchPositionId = null;
        let screenWakeLock = null;
        let currentDriverData = null;
        let isTripActive = false;
        let currentTripType = 'morning';
        let tripStatus = 'offline';
        let tripStatusMsg = 'غير متصل';
        let lastDbSyncEpoch = 0;
        let latestLat = null;
        let latestLng = null;

        function notify(title, message, type = 'info') {
            const backdrop = document.getElementById('sweetDialogBackdrop');
            const icon = document.getElementById('sweetDialogIcon');
            const titleEl = document.getElementById('sweetDialogTitle');
            const msgEl = document.getElementById('sweetDialogMessage');

            titleEl.textContent = title;
            msgEl.textContent = message;

            icon.className = `sweet-dialog-icon ${type}`;
            if (type === 'success') {
                icon.innerHTML = '<i class="fas fa-check"></i>';
            } else if (type === 'error') {
                icon.innerHTML = '<i class="fas fa-xmark"></i>';
            } else if (type === 'warning') {
                icon.innerHTML = '<i class="fas fa-triangle-exclamation"></i>';
            } else {
                icon.innerHTML = '<i class="fas fa-info"></i>';
            }

            backdrop.classList.add('active');
        }

        document.getElementById('sweetDialogBtn').addEventListener('click', () => {
            document.getElementById('sweetDialogBackdrop').classList.remove('active');
        });

        function initializeClient() {
            try {
                if (window.supabase && typeof window.supabase.createClient === 'function') {
                    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function acquireWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    screenWakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.warn(err);
            }
        }

        function releaseWakeLock() {
            if (screenWakeLock !== null) {
                screenWakeLock.release();
                screenWakeLock = null;
            }
        }

        document.getElementById('authForm').addEventListener('submit', async () => {
            const phone = document.getElementById('driverPhone').value.trim();
            const pass = document.getElementById('driverPass').value.trim();
            const btn = document.getElementById('authBtn');

            btn.disabled = true;
            btn.innerHTML = '<span>جاري التحقق...</span>';

            try {
                let driver = null;
                const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

                if (isLocal) {
                    try {
                        const res = await fetch('/api/bus/drivers');
                        if (res.ok) {
                            const drivers = await res.json();
                            driver = drivers.find(d => d.phone === phone);
                        }
                    } catch (e) {}
                }

                if (!driver && sbClient) {
                    const { data } = await sbClient.from('bus_drivers').select().eq('phone', phone).maybeSingle();
                    driver = data;
                }

                if (!driver) {
                    throw new Error('رقم الهاتف غير مسجل في المنظومة');
                }

                currentDriverData = driver;
                localStorage.setItem('driver_session_data', JSON.stringify(driver));
                renderDashboard();
            } catch (err) {
                notify('خطأ في تسجيل الدخول', err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i><span>تسجيل الدخول</span>';
            }
        });

        function renderDashboard() {
            document.getElementById('authPanel').classList.add('hidden');
            document.getElementById('dashboardPanel').classList.remove('hidden');
            document.getElementById('passengersPanel').classList.remove('hidden');

            document.getElementById('driverDisplayName').textContent = currentDriverData.full_name;
            document.getElementById('busRouteDisplay').textContent = `${currentDriverData.bus_number || 'حافلة النقل'} ${currentDriverData.route_name ? '• ' + currentDriverData.route_name : ''}`;

            loadPassengers();
            initRealtimeChannel();
        }

        async function loadPassengers() {
            const container = document.getElementById('passengersListContainer');
            try {
                let list = [];
                const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

                if (isLocal) {
                    try {
                        const res = await fetch(`/api/bus/drivers/${currentDriverData.id}/students`);
                        if (res.ok) list = await res.json();
                    } catch (e) {}
                }

                if (list.length === 0 && sbClient) {
                    const { data } = await sbClient.from('students_registry').select().eq('bus_driver_id', currentDriverData.id);
                    list = data || [];
                }

                document.getElementById('passengersCount').textContent = list.length;

                if (list.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 16px; font-size: 13px;">لا يوجد مشتركون مسندون لهذه الحافلة حالياً.</p>';
                    return;
                }

                container.innerHTML = list.map((item, idx) => `
                    <div class="passenger-item">
                        <div>
                            <div class="passenger-name">${idx + 1}. ${item.name}</div>
                            <div class="passenger-meta">${item.class_name || ''} - ${item.division_name || ''} | ${item.student_address || 'العنوان غير محدد'}</div>
                        </div>
                        ${item.parent_phone ? `<a href="tel:${item.parent_phone}" class="call-action"><i class="fas fa-phone"></i></a>` : ''}
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 16px; font-size: 13px;">تم تسجيل السائق بنجاح.</p>';
            }
        }

        function initRealtimeChannel() {
            if (!sbClient) return;
            broadcastChannel = sbClient.channel(`bus-tracking-${currentDriverData.id}`);
            broadcastChannel.subscribe();
        }

        function activateTelemetry() {
            if (!navigator.geolocation) {
                notify('تنبيه', 'المتصفح لا يدعم خدمة تحديد الموقع الجغرافي', 'warning');
                return;
            }

            acquireWakeLock();

            const pill = document.getElementById('statusPill');
            pill.className = 'status-indicator live';
            document.getElementById('statusPillText').textContent = 'بث مباشر';

            navigator.geolocation.getCurrentPosition(
                onLocationUpdate,
                onLocationError,
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );

            watchPositionId = navigator.geolocation.watchPosition(
                onLocationUpdate,
                onLocationError,
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );
        }

        function deactivateTelemetry() {
            if (watchPositionId !== null) {
                navigator.geolocation.clearWatch(watchPositionId);
                watchPositionId = null;
            }
            releaseWakeLock();

            const pill = document.getElementById('statusPill');
            pill.className = 'status-indicator offline';
            document.getElementById('statusPillText').textContent = 'غير متصل';
            document.getElementById('telemetrySpeed').textContent = '0';
            document.getElementById('telemetryAccuracy').textContent = '—';

            transmitLocation(null, null, 0, 0, 'offline', 'غير متصل');
        }

        function onLocationUpdate(pos) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const heading = pos.coords.heading || 0;
            const rawSpeed = pos.coords.speed || 0;
            const speedKmH = Math.round(rawSpeed * 3.6);
            const accuracy = Math.round(pos.coords.accuracy);

            document.getElementById('telemetrySpeed').textContent = speedKmH;
            document.getElementById('telemetryAccuracy').textContent = `${accuracy}م`;

            latestLat = lat;
            latestLng = lng;

            transmitLocation(lat, lng, heading, speedKmH, tripStatus, tripStatusMsg);

            const now = Date.now();
            if (now - lastDbSyncEpoch > 25000) {
                lastDbSyncEpoch = now;
                persistLocation(lat, lng, heading, speedKmH);
            }
        }

        function onLocationError(err) {
            console.warn(err);
            document.getElementById('telemetryAccuracy').textContent = 'ضعيفة';
        }

        function transmitLocation(lat, lng, heading, speed, status, statusMessage) {
            if (!broadcastChannel) return;
            const packet = {
                driver_id: currentDriverData.id,
                lat: lat,
                lng: lng,
                heading: heading,
                speed: speed,
                status: status,
                status_message: statusMessage,
                timestamp: new Date().toISOString()
            };
            try {
                broadcastChannel.send({
                    type: 'broadcast',
                    event: 'location_update',
                    payload: packet
                });
            } catch (e) {}
        }

        async function persistLocation(lat, lng, heading, speed) {
            if (!sbClient || !currentDriverData) return;
            try {
                await sbClient.from('bus_live_locations').upsert({
                    driver_id: currentDriverData.id,
                    school_code: currentDriverData.school_code || 'DEFAULT',
                    trip_type: currentTripType,
                    status: tripStatus,
                    status_message: tripStatusMsg,
                    lat: lat,
                    lng: lng,
                    heading: heading,
                    speed: speed,
                    last_updated: new Date().toISOString()
                });
            } catch (e) {}
        }

        document.getElementById('btnStartMorning').addEventListener('click', () => {
            currentTripType = 'morning';
            tripStatus = 'on_the_way';
            tripStatusMsg = 'الحافلة في مسار الذهاب إلى الوجهة';
            startTripSession();
        });

        document.getElementById('btnStartEvening').addEventListener('click', () => {
            currentTripType = 'afternoon';
            tripStatus = 'on_the_way';
            tripStatusMsg = 'الحافلة في مسار العودة';
            startTripSession();
        });

        function startTripSession() {
            isTripActive = true;
            document.getElementById('tripIdleControls').classList.add('hidden');
            document.getElementById('tripRunningControls').classList.remove('hidden');
            document.getElementById('currentStatusText').textContent = tripStatusMsg;
            activateTelemetry();
        }

        document.getElementById('btnArrived').addEventListener('click', () => {
            tripStatus = 'arrived';
            tripStatusMsg = 'تم وصول الحافلة إلى الوجهة المحددة';
            document.getElementById('currentStatusText').textContent = tripStatusMsg;
            if (latestLat && latestLng) {
                transmitLocation(latestLat, latestLng, 0, 0, tripStatus, tripStatusMsg);
                persistLocation(latestLat, latestLng, 0, 0);
            }
        });

        document.getElementById('btnEndTrip').addEventListener('click', () => {
            tripStatus = 'offline';
            tripStatusMsg = 'تم إنهاء الرحلة';
            isTripActive = false;
            deactivateTelemetry();

            document.getElementById('tripRunningControls').classList.add('hidden');
            document.getElementById('tripIdleControls').classList.remove('hidden');
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            deactivateTelemetry();
            localStorage.removeItem('driver_session_data');
            location.reload();
        });

        window.addEventListener('DOMContentLoaded', () => {
            initializeClient();
            const session = localStorage.getItem('driver_session_data');
            if (session) {
                try {
                    currentDriverData = JSON.parse(session);
                    renderDashboard();
                } catch (e) {
                    localStorage.removeItem('driver_session_data');
                }
            }
        });
    </script>
</body>
</html>
