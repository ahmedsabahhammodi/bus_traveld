<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة السائق - تتبع حافلات النقل المدرسي</title>
    <!-- FontAwesome & Google Fonts CDN for Vercel/Web -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* Top Header */
        header {
            padding: 16px 20px;
            background: var(--card-dark);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 800;
            color: #60a5fa;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge.offline {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .status-badge.live {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Container */
        .container {
            flex: 1;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--card-dark);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        /* Login Screen */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }

        /* HUD & Telemetry */
        .hud-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .hud-item {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .hud-val {
            font-size: 24px;
            font-weight: 900;
            color: #60a5fa;
            line-height: 1.2;
        }

        .hud-lbl {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Action Buttons */
        .trip-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .trip-status-title {
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        /* Students List */
        .students-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .student-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 8px;
        }

        .student-info h4 {
            font-size: 15px;
            font-weight: 700;
        }

        .student-info p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .call-btn {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
        }

        .wakelock-alert {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 12px;
            color: #93c5fd;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Settings modal for custom anon key if needed */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i class="fas fa-bus"></i>
            <span>تتبع السائق</span>
        </div>
        <div class="status-badge offline" id="liveBadge">
            <i class="fas fa-circle"></i>
            <span id="liveBadgeText">غير متصل</span>
        </div>
    </header>

    <div class="container">

        <!-- 1. شاشة تسجيل الدخول -->
        <div class="card" id="loginCard">
            <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 20px; text-align: center; color: #60a5fa;">
                <i class="fas fa-id-card"></i> دخول السائق
            </h2>
            <form id="loginForm" onsubmit="return false;">
                <div class="form-group">
                    <label>رقم هاتف السائق</label>
                    <input type="tel" id="driverPhone" required placeholder="مثال: 07801234567" autocomplete="tel">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="driverPass" required placeholder="••••••">
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>
            </form>
        </div>

        <!-- 2. لوحة التحكم بالرحلة بعد تسجيل الدخول -->
        <div class="card hidden" id="tripCard">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <div>
                    <h3 id="driverNameTxt" style="font-size: 18px; font-weight: 800; color: #fff;">أهلاً بالسائق</h3>
                    <p id="busInfoTxt" style="font-size: 13px; color: var(--text-muted);">باص 01</p>
                </div>
                <button id="logoutBtn" style="background: none; border: none; color: #f87171; font-size: 14px; cursor: pointer;">
                    <i class="fas fa-power-off"></i> خروج
                </button>
            </div>

            <!-- HUD عدادات وتيليمتري -->
            <div class="hud-grid">
                <div class="hud-item">
                    <div class="hud-val" id="speedVal">0</div>
                    <div class="hud-lbl">السرعة (كم/س)</div>
                </div>
                <div class="hud-item">
                    <div class="hud-val" id="gpsQualityVal" style="font-size: 16px; padding-top: 5px;">في الانتظار</div>
                    <div class="hud-lbl">إشارة الـ GPS</div>
                </div>
            </div>

            <div class="wakelock-alert" style="margin-bottom: 16px;">
                <i class="fas fa-sun"></i>
                <span>شاشة الهاتف ستبقى مضاءة تلقائياً أثناء القيادة</span>
            </div>

            <!-- أزرار التحكم بالرحلة -->
            <div class="trip-controls" id="notStartedControls">
                <button class="btn btn-primary" id="startMorningBtn">
                    <i class="fas fa-sun"></i> بدء رحلة صباحية للمدرسة 🌅
                </button>
                <button class="btn btn-warning" id="startEveningBtn">
                    <i class="fas fa-moon"></i> بدء رحلة مسائية للمنازل 🌇
                </button>
            </div>

            <div class="trip-controls hidden" id="activeTripControls">
                <div class="trip-status-title" id="currentTripStatusText">🚌 الباص في الطريق للطلاب...</div>

                <button class="btn btn-success" id="arrivedSchoolBtn">
                    <i class="fas fa-school"></i> وصلت للمدرسة 🏫 (تنبيه الأهالي)
                </button>

                <button class="btn btn-primary hidden" id="onWayBackBtn">
                    <i class="fas fa-route"></i> في طريق العودة 🔄
                </button>

                <button class="btn btn-danger" id="finishTripBtn">
                    <i class="fas fa-flag-checkered"></i> إنهاء الرحلة 🏁
                </button>
            </div>
        </div>

        <!-- 3. كشف طلاب الباص -->
        <div class="card hidden" id="studentsCard">
            <div class="students-header">
                <h3 style="font-size: 16px; font-weight: 800;"><i class="fas fa-users"></i> طلاب الباص (<span id="studentsCountTxt">0</span>)</h3>
            </div>
            <div id="studentsListContainer">
                <p style="text-align: center; color: var(--text-muted); padding: 15px;">جاري جلب قائمة الطلاب...</p>
            </div>
        </div>

    </div>

    <script>
        // إعدادات Supabase المخصصة للباصات
        const SUPABASE_URL = 'https://oogbfwcbfhacsuxdjcne.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_0Yj2RwNpLbxFDFOS0-baVQ_JAjAaDLm';

        let sbClient = null;
        let realtimeChannel = null;
        let watchPositionId = null;
        let wakeLock = null;
        let currentDriver = null;
        let isTripActive = false;
        let currentTripType = 'morning';
        let currentStatus = 'offline';
        let currentStatusMsg = 'غير متصل';
        let lastDbSyncTime = 0;
        let lastLat = null;
        let lastLng = null;

        function initSupabase() {
            try {
                if (window.supabase && typeof window.supabase.createClient === 'function') {
                    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }
            } catch (e) {
                console.error("Supabase init error:", e);
            }
        }

        // تفعيل قفل الشاشة المضاءة (Screen Wake Lock)
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('✅ Screen Wake Lock Active');
                }
            } catch (err) {
                console.warn('Wake Lock not supported or denied:', err.message);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        const isLocalServer = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

        // تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', async () => {
            const phone = document.getElementById('driverPhone').value.trim();
            const pass = document.getElementById('driverPass').value.trim();
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

            try {
                let driver = null;
                if (isLocalServer) {
                    try {
                        const res = await fetch(`/api/bus/drivers`);
                        if (res.ok) {
                            const drivers = await res.json();
                            driver = drivers.find(d => d.phone === phone);
                        }
                    } catch(e){}
                }

                if (!driver && sbClient) {
                    const { data } = await sbClient.from('bus_drivers').select().eq('phone', phone).maybeSingle();
                    driver = data;
                }

                if (!driver) {
                    throw new Error('رقم الهاتف غير مسجل لسائق');
                }

                currentDriver = driver;
                localStorage.setItem('saved_bus_driver', JSON.stringify(driver));
                showDriverDashboard();
            } catch (err) {
                alert(`فشل الدخول: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
            }
        });

        function showDriverDashboard() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('tripCard').classList.remove('hidden');
            document.getElementById('studentsCard').classList.remove('hidden');

            document.getElementById('driverNameTxt').textContent = currentDriver.full_name;
            document.getElementById('busInfoTxt').textContent = `${currentDriver.bus_number || 'باص المدرسة'} ${currentDriver.route_name ? '• ' + currentDriver.route_name : ''}`;

            loadAssignedStudents();
            setupRealtimeChannel();
        }

        // جلب طلاب الباص
        async function loadAssignedStudents() {
            const container = document.getElementById('studentsListContainer');
            try {
                let students = [];
                if (isLocalServer) {
                    try {
                        const res = await fetch(`/api/bus/drivers/${currentDriver.id}/students`);
                        if (res.ok) students = await res.json();
                    } catch(e){}
                }

                if (students.length === 0 && sbClient) {
                    const { data } = await sbClient.from('students_registry').select().eq('bus_driver_id', currentDriver.id);
                    students = data || [];
                }

                document.getElementById('studentsCountTxt').textContent = students.length;

                if (students.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 15px;">لا يوجد طلاب مسندين لهذا الباص حالياً.</p>';
                    return;
                }

                container.innerHTML = students.map((s, i) => `
                    <div class="student-card">
                        <div class="student-info">
                            <h4>${i + 1}. ${s.name}</h4>
                            <p>${s.class_name || ''} - ${s.division_name || ''} | ${s.student_address || 'العنوان غير محدد'}</p>
                        </div>
                        ${s.parent_phone ? `<a href="tel:${s.parent_phone}" class="call-btn" title="اتصال بولي الأمر"><i class="fas fa-phone"></i></a>` : ''}
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 15px;">تم تسجيل السائق بنجاح.</p>';
            }
        }

        // إعداد قناة البث المباشر
        function setupRealtimeChannel() {
            if (!sbClient) return;
            realtimeChannel = sbClient.channel(`bus-tracking-${currentDriver.id}`);
            realtimeChannel.subscribe((status) => {
                console.log('Realtime broadcast channel status:', status);
            });
        }

        // بدء التتبع المباشر
        function startLiveTracking() {
            if (!navigator.geolocation) {
                alert('عذراً، المتصفح لا يدعم تحديد الموقع GPS');
                return;
            }

            requestWakeLock();

            document.getElementById('liveBadge').className = 'status-badge live';
            document.getElementById('liveBadgeText').textContent = 'بث مباشر 🟢';

            // جلب الموقع فوراً بدون تأخير
            navigator.geolocation.getCurrentPosition(
                handlePositionUpdate,
                handlePositionError,
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );

            watchPositionId = navigator.geolocation.watchPosition(
                handlePositionUpdate,
                handlePositionError,
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                }
            );
        }

        function stopLiveTracking() {
            if (watchPositionId !== null) {
                navigator.geolocation.clearWatch(watchPositionId);
                watchPositionId = null;
            }
            releaseWakeLock();

            document.getElementById('liveBadge').className = 'status-badge offline';
            document.getElementById('liveBadgeText').textContent = 'غير متصل';
            document.getElementById('speedVal').textContent = '0';
            document.getElementById('gpsQualityVal').textContent = 'متوقف';

            // إرسال حالة عدم الاتصال
            sendLocationTick(null, null, 0, 0, 'offline', 'غير متصل');
        }

        // معالجة كل نقطة GPS جديدة
        function handlePositionUpdate(pos) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const heading = pos.coords.heading || 0;
            const rawSpeed = pos.coords.speed || 0; // م/ث
            const speedKmH = Math.round(rawSpeed * 3.6);
            const accuracy = Math.round(pos.coords.accuracy);

            document.getElementById('speedVal').textContent = speedKmH;
            
            let quality = 'جيدة 🟢';
            if (accuracy > 30) quality = 'متوسطة 🟡';
            if (accuracy > 80) quality = 'ضعيفة 🔴';
            document.getElementById('gpsQualityVal').textContent = `${quality} (${accuracy}m)`;

            lastLat = lat;
            lastLng = lng;

            // 1. إرسال بث فوري بالذاكرة لجميع الأهالي (Zero DB Cost)
            sendLocationTick(lat, lng, heading, speedKmH, currentStatus, currentStatusMsg);

            // 2. تحديث الداتابيز كل 25 ثانية أو عند تحرك ملحوظ
            const now = Date.now();
            if (now - lastDbSyncTime > 25000) {
                lastDbSyncTime = now;
                syncLocationToDatabase(lat, lng, heading, speedKmH);
            }
        }

        function handlePositionError(err) {
            console.warn('GPS Error:', err.message);
            document.getElementById('gpsQualityVal').textContent = 'فقدت الإشارة ⚠️';
        }

        // بث لحظي عبر WebSocket Broadcast
        function sendLocationTick(lat, lng, heading, speed, status, statusMessage) {
            if (!realtimeChannel) return;
            const data = {
                driver_id: currentDriver.id,
                lat: lat,
                lng: lng,
                heading: heading,
                speed: speed,
                status: status,
                status_message: statusMessage,
                timestamp: new Date().toISOString()
            };
            try {
                realtimeChannel.send({
                    type: 'broadcast',
                    event: 'location_update',
                    payload: data
                });
            } catch(e) {
                console.warn('Broadcast send error:', e);
            }
        }

        // تحديث جدول bus_live_locations عبر UPSERT
        async function syncLocationToDatabase(lat, lng, heading, speed) {
            if (!sbClient || !currentDriver) return;
            try {
                await sbClient.from('bus_live_locations').upsert({
                    driver_id: currentDriver.id,
                    school_code: currentDriver.school_code || 'DEFAULT',
                    trip_type: currentTripType,
                    status: currentStatus,
                    status_message: currentStatusMsg,
                    lat: lat,
                    lng: lng,
                    heading: heading,
                    speed: speed,
                    last_updated: new Date().toISOString()
                });
            } catch (e) {
                console.error("Failed to upsert bus location:", e);
            }
        }

        // أحداث أزرار الرحلة
        document.getElementById('startMorningBtn').addEventListener('click', () => {
            currentTripType = 'morning';
            currentStatus = 'on_the_way';
            currentStatusMsg = 'الباص في الطريق إلى المدرسة 🌅';
            startTripUI();
        });

        document.getElementById('startEveningBtn').addEventListener('click', () => {
            currentTripType = 'afternoon';
            currentStatus = 'on_the_way';
            currentStatusMsg = 'الباص في طريق إعادة الطلاب للمنازل 🌇';
            startTripUI();
        });

        function startTripUI() {
            isTripActive = true;
            document.getElementById('notStartedControls').classList.add('hidden');
            document.getElementById('activeTripControls').classList.remove('hidden');
            document.getElementById('currentTripStatusText').textContent = currentStatusMsg;
            startLiveTracking();
        }

        document.getElementById('arrivedSchoolBtn').addEventListener('click', () => {
            currentStatus = 'arrived';
            currentStatusMsg = '🟢 وصل الباص إلى المدرسة بحمد الله!';
            document.getElementById('currentTripStatusText').textContent = currentStatusMsg;
            if (lastLat && lastLng) {
                sendLocationTick(lastLat, lastLng, 0, 0, currentStatus, currentStatusMsg);
                syncLocationToDatabase(lastLat, lastLng, 0, 0);
            }
            alert('🎉 تم إرسال إشعار وصول الباص للمدرسة لجميع أولياء الأمور!');
        });

        document.getElementById('finishTripBtn').addEventListener('click', () => {
            if (!confirm('هل أنت متأكد من إنهاء الرحلة الحالية وإيقاف البث؟')) return;
            currentStatus = 'offline';
            currentStatusMsg = 'انتهت الرحلة';
            isTripActive = false;
            stopLiveTracking();

            document.getElementById('activeTripControls').classList.add('hidden');
            document.getElementById('notStartedControls').classList.remove('hidden');
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (isTripActive && !confirm('أنت في منتصف رحلة، هل تريد الخروج وإيقاف التتبع؟')) return;
            stopLiveTracking();
            localStorage.removeItem('saved_bus_driver');
            location.reload();
        });

        // التحقق من الجلسة السابقة
        window.addEventListener('DOMContentLoaded', () => {
            initSupabase();
            const saved = localStorage.getItem('saved_bus_driver');
            if (saved) {
                try {
                    currentDriver = JSON.parse(saved);
                    showDriverDashboard();
                } catch (e) {
                    localStorage.removeItem('saved_bus_driver');
                }
            }
        });
    </script>
</body>
</html>
